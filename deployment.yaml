apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-devops-app
  labels:
    app: flask-devops-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-devops-app
  template:
    metadata:
      labels:
        app: flask-devops-app
    spec:
      containers:
      - name: flask-app
        image: u3ser/flask-devops-app:latest
        ports:
        - containerPort: 5000
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: flask-devops-app-service
spec:
  type: NodePort
  selector:
    app: flask-devops-app
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30977